<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações Push</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background-color: #1e1e1e;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      color: #317f6f;
      margin: 0 0 0.5rem 0;
      font-size: 1.8rem;
    }
    p {
      color: #a0a0a0;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .status-btn {
      background-color: #317f6f;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }
    .status-btn:hover {
      background-color: #276659;
    }
    .status-btn.disabled {
      background-color: #444;
      cursor: default;
    }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🔔</div>
    <h1>Central de Notificações</h1>
    <p>Inscreva-se para receber atualizações e avisos importantes diretamente no seu dispositivo.</p>
    
    <button id="btnNotif" class="status-btn">Ativar Notificações</button>

    <div class="footer">
      Alimentado por ntfy • Conexão Segura SSL
    </div>
  </div>

  <script>
    const TOPICO = "geral";
    const SERVIDOR = window.location.origin;
    const btn = document.getElementById("btnNotif");

    async function init() {
      if (!("Notification" in window)) {
        btn.textContent = "Notificações Não Suportadas";
        btn.classList.add("disabled");
        return;
      }

      if (Notification.permission === "granted") {
        conectarEventSource();
      } else {
        btn.addEventListener("click", solicitarPermissao);
        solicitarPermissao();
      }
    }

    async function solicitarPermissao() {
      const permission = await Notification.requestPermission();
      if (permission === "granted") {
        conectarEventSource();
      } else if (permission === "denied") {
        btn.textContent = "Notificações Bloqueadas";
        btn.classList.add("disabled");
      }
    }

    function conectarEventSource() {
      btn.textContent = "✓ Notificações Ativas";
      btn.classList.add("disabled");

      const eventSource = new EventSource(`${SERVIDOR}/${TOPICO}/sse`);

      eventSource.onmessage = function(event) {
        try {
          const data = JSON.parse(event.data);
          if (data.event === "message") {
            const iconUrl = data.icon || (data.attachment && data.attachment.url) || "/static/images/custom-logo.png";
            exibirNotificacao(data.title || "Nova Notificação", data.message, iconUrl);
          }
        } catch (e) {
          console.error("Erro ao processar mensagem", e);
        }
      };

      eventSource.onerror = function() {
        console.log("Reconectando ao servidor de notificações...");
      };
    }

    function exibirNotificacao(titulo, mensagem, iconeCustomizado) {
      if (Notification.permission === "granted") {
        let iconPath = iconeCustomizado || "/static/images/custom-logo.png";
        if (!iconPath.startsWith("http")) {
          iconPath = window.location.origin + iconPath;
        }
        const options = {
          body: mensagem,
          icon: iconPath,
          badge: iconPath
        };
        new Notification(titulo, options);
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>

</body>
</html>
